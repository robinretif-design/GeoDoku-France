    <rect x="318" width="84" height="84" rx="20" fill="#D8A84F"/>
    <text x="0" y="122" fill="#5B4634" font-family="Inter, Arial, sans-serif" font-size="18">#24334F</text>
    <text x="106" y="122" fill="#5B4634" font-family="Inter, Arial, sans-serif" font-size="18">#6F7F4F</text>
    <text x="212" y="122" fill="#5B4634" font-family="Inter, Arial, sans-serif" font-size="18">#B85C38</text>
    <text x="318" y="122" fill="#5B4634" font-family="Inter, Arial, sans-serif" font-size="18">#D8A84F</text>
