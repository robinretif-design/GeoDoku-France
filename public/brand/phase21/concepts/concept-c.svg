<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Concept C - GévoCroisée jeu moderne mobile first</title>
  <desc id="desc">Planche de concept visuel mobile-first, mémorisable et centrée sur un symbole de croisement.</desc>
  <rect width="1200" height="720" fill="#F4F6F0"/>
  <rect x="64" y="64" width="1072" height="592" rx="36" fill="#FFFFFF" stroke="#D8C9B6" stroke-width="2"/>
  <g transform="translate(124 126)">
    <rect width="208" height="208" rx="56" fill="#17213A"/>
    <path d="M60 60H96C104 60 110 66 110 74V96C110 104 104 110 96 110H60V60Z" fill="#1F8A70"/>
    <path d="M112 60H148V110H112C104 110 98 104 98 96V74C98 66 104 60 112 60Z" fill="#F7C948"/>
    <path d="M60 112H96C104 112 110 118 110 126V148H60V112Z" fill="#FFFFFF"/>
    <path d="M112 112H148V148H112C104 148 98 142 98 134V126C98 118 104 112 112 112Z" fill="#FF6B4A"/>
    <path d="M104 46V162" fill="none" stroke="#F4F6F0" stroke-width="12" stroke-linecap="round"/>
    <path d="M46 104H162" fill="none" stroke="#F4F6F0" stroke-width="12" stroke-linecap="round"/>
    <circle cx="104" cy="104" r="18" fill="#17213A"/>
    <circle cx="104" cy="104" r="8" fill="#FF6B4A"/>
    <path d="M68 154C90 168 126 165 146 144" fill="none" stroke="#F4F6F0" stroke-width="5" stroke-linecap="round" opacity=".72"/>
  </g>
  <text x="380" y="165" fill="#17213A" font-family="Sora, Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="64" font-weight="850">GévoCroisée</text>
  <text x="382" y="212" fill="#1F8A70" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" letter-spacing=".3">Croiser. Trouver. Redécouvrir.</text>
  <text x="124" y="408" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="760">Concept</text>
  <text x="124" y="452" fill="#374151" font-family="Inter, Arial, sans-serif" font-size="22">Une marque de jeu quotidienne : quatre idées convergent vers un point de découverte.</text>
  <text x="124" y="512" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="760">Usage</text>
  <text x="124" y="556" fill="#374151" font-family="Inter, Arial, sans-serif" font-size="22">Pensé pour favicon, PWA, écran mobile, score partagé et reconnaissance rapide.</text>
