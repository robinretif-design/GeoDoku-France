    <meta name="twitter:card" content="summary_large_image" />

    <link rel="canonical" href="https://gevocroisee.fr/" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/gevocroisee-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <title>GévoCroisée</title>
    <style>
      :root {
        color: #111827;
        background: #f4f6f0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        background: radial-gradient(circle at 10px 10px, rgba(20,33,61,0.045) 1px, transparent 1px), #f4f6f0;
        background-size: 18px 18px;
      }

      .initial-loading {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }

      .initial-loading img {
        width: 56px;
        height: 56px;
        display: block;
        margin: 0 auto 14px;
      }

      .initial-loading strong {
        display: block;
        font-family: Georgia, serif;
        font-size: 24px;
      }

      .initial-loading span {
        display: block;
        margin-top: 6px;
        color: #64748b;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loading" role="status" aria-live="polite">
        <div>
          <img src="/brand/gevocroisee-mark.svg" alt="" />
          <strong>GévoCroisée</strong>
          <span>Chargement de la grille du jour...</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
